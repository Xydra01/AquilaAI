name: ci

on:
  push:
    branches: [Aquila-cpp]
  pull_request:
    branches: [Aquila-cpp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_VERSION: "4.3.2"
  NINJA_VERSION: "1.13.2"

jobs:
  windows-msvc:
    name: windows-msvc (release + asan, Qt)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      # aqtinstall 3.3.0 cannot read the Qt >= 6.11 repository layout; same pin as scripts/install-qt.ps1.
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.11.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7"
      - name: Toolchain
        run: |
          cl 2>&1 | Select-Object -First 1
          cmake --version
          echo "QT_ROOT_DIR=$env:QT_ROOT_DIR"
      - name: msvc-release
        run: cmake --workflow --preset msvc-release
      - name: msvc-asan
        run: cmake --workflow --preset msvc-asan

  windows-mingw-san:
    name: windows-mingw-san (llvm-mingw ASan + UBSan)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      LLVM_MINGW: "20260505"
      LLVM_MINGW_SHA256: "3e6919b3da2b6bfc05d8caf0ab10d5c0be4ddbb873b3c33790a71fe43c09c51f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}
      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW-ucrt-x86_64"
          $zip = "$env:RUNNER_TEMP\$name.zip"
          curl.exe -sSLf -o $zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW/$name.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw hash mismatch: $hash" }
          7z x $zip "-o$env:RUNNER_TEMP" -y | Out-Null
          "$env:RUNNER_TEMP\$name\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Toolchain
        run: |
          clang++ --version
          cmake --version
      - name: mingw-san
        run: cmake --workflow --preset mingw-san

  linux-san:
    name: linux-san (clang ASan + UBSan + LSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}
      # ASan in older clang crashes under the kernel's high-entropy mmap randomization.
      - name: Reduce mmap ASLR entropy for ASan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Toolchain
        run: |
          clang++ --version
          cmake --version
      - name: linux-san
        run: cmake --workflow --preset linux-san
